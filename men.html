<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Men | Blessed Shop</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #111;
            background: #fff;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #eee;
        }

        .logo {
            color: #111;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #111;
            text-decoration: none;
            font-size: 15px;
        }

        .header-actions {
            display: flex;
            gap: 20px;
        }

        .header-actions a {
            color: #111;
            text-decoration: none;
        }

        main {
            padding: 60px;
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-bottom: 40px;
        }

        .page-label {
            color: #777;
            font-size: 13px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 42px;
        }

        .product-count {
            color: #777;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            text-decoration: none;
            color: #111;
            display: block;
        }

        .product-image {
            position: relative;
            height: 430px;
            background: #f3f3f3;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .favorite {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 20px;
            cursor: pointer;
        }

        .product-info {
            padding-top: 18px;
        }

        .category {
            color: #777;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 17px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: #555;
            text-decoration: none;
        }

        @media (max-width: 900px) {

            header {
                padding: 0 25px;
            }

            main {
                padding: 30px 25px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="index.html"
        class="logo"
    >
        BLESSED
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="men.html">
            Men
        </a>

        <a href="women.html">
            Women
        </a>

        <a href="shoes.html">
            Shoes
        </a>

    </nav>


    <div class="header-actions">

        <a href="index.html">
            Search
        </a>

        <a href="index.html">
            ♡
        </a>

        <a href="index.html">
            🛒
        </a>

    </div>

</header>


<main>


    <a
        href="index.html"
        class="back"
    >
        ← Back to home
    </a>


    <div class="page-top">

        <div>

            <p class="page-label">
                MEN'S COLLECTION
            </p>

            <h1>
                Men's Clothing
            </h1>

        </div>


        <p class="product-count">
            4 products
        </p>

    </div>


    <div class="product-grid">


        <a
            href="product.html?id=men-tshirt"
            class="product-card"
        >

            <div class="product-image">

                <img
                    src="images/products/men/tshirt.jpg"
                    alt="Ed Hardy T-Shirt"
                >

                <button
                    class="favorite"
                    onclick="event.preventDefault();"
                >
                    ♡
                </button>

            </div>

            <div class="product-info">

                <p class="category">
                    T-SHIRTS
                </p>

                <h2 class="product-name">
                    Ed Hardy T-Shirt
                </h2>

                <p class="price">
                    12 990 ₸
                </p>

            </div>

        </a>



        <a
            href="product.html?id=men-hoodie"
            class="product-card"
        >

            <div class="product-image">

                <img
                    src="images/products/men/hoodie.jpg"
                    alt="Ed Hardy Hoodie"
                >

                <button
                    class="favorite"
                    onclick="event.preventDefault();"
                >
                    ♡
                </button>

            </div>

            <div class="product-info">

                <p class="category">
                    HOODIES
                </p>

                <h2 class="product-name">
                    Ed Hardy Hoodie
                </h2>

                <p class="price">
                    24 990 ₸
                </p>

            </div>

        </a>



        <a
            href="product.html?id=men-jeans"
            class="product-card"
        >

            <div class="product-image">

                <img
                    src="images/products/men/jeans.jpg"
                    alt="Ed Hardy Jeans"
                >

                <button
                    class="favorite"
                    onclick="event.preventDefault();"
                >
                    ♡
                </button>

            </div>

            <div class="product-info">

                <p class="category">
                    JEANS
                </p>

                <h2 class="product-name">
                    Ed Hardy Jeans
                </h2>

                <p class="price">
                    19 990 ₸
                </p>

            </div>

        </a>



        <a
            href="product.html?id=men-mm6"
            class="product-card"
        >

            <div class="product-image">

                <img
                    src="images/products/men/mm6 sneakers.jpg"
                    alt="MM6 Sneakers"
                >

                <button
                    class="favorite"
                    onclick="event.preventDefault();"
                >
                    ♡
                </button>

            </div>

            <div class="product-info">

                <p class="category">
                    SNEAKERS
                </p>

                <h2 class="product-name">
                    MM6 Sneakers
                </h2>

                <p class="price">
                    39 990 ₸
                </p>

            </div>

        </a>


    </div>


</main>


</body>

</html>
